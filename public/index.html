<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机场冬季运行协同推演平台</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2334d399%22/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <div>
      <div class="brand-title">机场冬季运行协同推演平台</div>
      <div class="brand-sub">跑道摩擦 · 降雪 · 除冰车辆 · 起降窗口 · 防冰有效时间</div>
    </div>
  </div>
  <div class="plan-switch">
    <label>处置方案</label>
    <select id="planSelect"></select>
    <button id="clonePlanBtn" class="btn" title="基于当前方案另存一套">另存方案</button>
    <button id="newPlanBtn" class="btn primary">新建方案</button>
    <button id="resetPlanBtn" class="btn danger-ghost" title="放弃当前方案的全部真实进度">重置执行</button>
  </div>
  <div class="clock-box">
    <div class="clock-label">真实执行时钟</div>
    <div class="clock-value"><span id="clockText">00:00</span> <small id="clockNote">计划基准 T0</small></div>
  </div>
</header>

<main class="layout">
  <!-- 左：调整面板 -->
  <aside class="panel left">
    <section class="card">
      <h3>推演控制</h3>
      <div class="transport">
        <button id="playBtn" class="btn primary wide">▶ 执行</button>
        <button id="stepBtn" class="btn">步进 +5′</button>
        <select id="speedSel" class="mini">
          <option value="1">1×（1′/秒）</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <button id="nowBtn" class="btn mini">回到当前</button>
        <button id="replanBtn" class="btn warn wide">重新推演未来</button>
      </div>
      <div class="hint">已执行的清扫与已结束的航班会被锁定，调整只影响尚未发生的部分。</div>
    </section>

    <section class="card">
      <h3>降雪强度剖面</h3>
      <div id="snowEditor" class="snow-editor"></div>
    </section>

    <section class="card" id="runwayCard">
      <h3>跑道关闭区与清扫顺序</h3>
      <div id="runwayEditor"></div>
    </section>

    <section class="card">
      <h3>航空器延后</h3>
      <div id="flightEditor" class="flight-editor"></div>
    </section>
  </aside>

  <!-- 中：空间视图 -->
  <section class="panel center">
    <div class="map-toolbar">
      <div id="mapLegend" class="legend"></div>
      <div id="weatherNow" class="weather-now"></div>
    </div>
    <div class="map-wrap">
      <svg id="mapSvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="mapTooltip" class="map-tooltip" hidden></div>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-head">
        <span>时间线（分钟，T0 起 4 小时）</span>
        <span id="timelineHint" class="hint-inline">点击告警可在空间与时间线同时定位</span>
      </div>
      <svg id="timelineSvg" viewBox="0 0 960 330" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <!-- 右：告警与航班 -->
  <aside class="panel right">
    <section class="card stats-card">
      <h3>推演态势</h3>
      <div id="stats" class="stats"></div>
    </section>
    <section class="card alerts-card">
      <h3>冲突与告警 <span id="alertCount" class="count"></span></h3>
      <div id="alertList" class="alert-list"></div>
    </section>
    <section class="card flights-card">
      <h3>航空器状态</h3>
      <div id="flightList" class="flight-list"></div>
    </section>
  </aside>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
